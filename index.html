<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&"/>
    <link rel="stylesheet" href="css/style.css">
    <title>Document</title>
</head>
<body>
    <header>
        <button class="back-home hidde"><span class="material-symbols-outlined">arrow_left_alt</span></button>
        <span class="material-symbols-outlined logo filled">store</span>
        <button class="theme-toggle"><span class="material-symbols-outlined filled">moon_stars</span></button>
    </header>

    <main>
        <section id="home" class="home-header hidden"> <!-- REMOVE HIDDEN LATER-->
            <div class="home-title">
                <h1 class="title-text">COMPARADOR DE SUPERMERCADO</h1>
                <p class="subtitle-text">Compare preços e economize!</p>
            </div>

            <div class="home-menu">
                <button data-view="new-list" class="menu-btn"><span class="material-symbols-outlined filled">shopping_cart</span>CRIAR NOVA COMPRA</button>
                <button data-view="markets" class="menu-btn"><span class="material-symbols-outlined filled">store</span>MERCADOS CADASTRADOS</button>
                <button data-view="shopping-lists" class="menu-btn"><span class="material-symbols-outlined filled">list_alt</span>HISTÓRICO DE COMPRAS</button>
            </div>
        </section>

        <section id="new-list" class="new-list hidden"> 
            <div class="div-new-list"></div>
        </section>

        <section id="markets" class="markets ">  <!-- ADD HIDDEN LATER-->
            <div class="markets-view">
                <div class="market-action">
                    <button id="new-market-btn" class="new-market-btn">ADICIONAR MERCADO</button>
                </div>

                <div class="markets-container">
                    <div class="empty-markets">
                        <span class="material-symbols-outlined filled">add_business</span>
                        <h1>NENHUM MERCADO CADASTRADO !</h1>
                        <p>Adicione um mercado para comparar preços.</p>
                    </div>
                </div>
                
            </div>
        </section>

        <section id="shopping-lists" class="shopping-lists hidden">
            <div class="div-list"></div>   
        </section>
    </main>

    <footer>
        <p>Comparador de Mercado feito por <a href="https://github.com/Thales-Chaves98" target="_blank">Thales Chaves</a>.</p>
    </footer>

    <dialog id="add-market-modal" class="modal">
        <div class="modal-container">
            <div class="modal-header">
                <h2>ADICIONAR MERCADO</h2>
            </div>
            <div class="modal-content">
                <label for="market-name-input" class="market-label">SUPERMERCADO:</label>
                <input type="text" id="market-name-input" class="market-name-input" placeholder="NOME DO MERCADO">
            </div>
        </div>

        <div class="modal-actions">
            <button id="cancel-market-btn" class="cancel-btn">CANCELAR</button>
            <button id="save-market-btn" class="save-btn">SALVAR</button>
        </div>
        
    </dialog>


    <script src="script/app.js"></script>
</body>
</html>
