<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&"/>
    <link rel="stylesheet" href="css/style.css">
    <title>Document</title>
</head>
<body>
    <header>
        <button class="back-home"><span class="material-symbols-outlined">arrow_left_alt</span></button>
        <span class="material-symbols-outlined logo filled">store</span>
        <button class="theme-toggle" id="theme-toggle"><span class="material-symbols-outlined filled">moon_stars</span></button>
    </header>

    <main>
        <section id="home" class="home-header"> 
            <div class="home-title">
                <h1 class="title-text">COMPARADOR DE SUPERMERCADO</h1>
                <p class="subtitle-text">Compare preços e economize!</p>
            </div>

            <div class="home-menu">
                <button data-view="new-list" class="menu-btn"><span class="material-symbols-outlined filled">shopping_cart</span>CRIAR NOVA COMPRA</button>
                <button data-view="markets" class="menu-btn"><span class="material-symbols-outlined filled">store</span>MERCADOS CADASTRADOS</button>
                <button data-view="shopping-lists" class="menu-btn"><span class="material-symbols-outlined filled">list_alt</span>HISTÓRICO DE COMPRAS</button>
            </div>
        </section>

        <section id="new-list" class="new-list"> 
            <div class="new-list-action">
                    <button id="new-list-btn" class="call-action-btn">ADICIONAR COMPRA</button>
            </div>

            <div class="new-list-container">
                <form id="new-list-form" class="new-list-form">
                    <div class="form-group">
                        <label for="list-date">DATA DA COMPRA:</label>
                        <input type="date" id="list-date" name="list-date" required>
                    </div>
                    <div class="form-group">
                        <p class="form-label">SUPERMERCADOS:</p>
                        <div id="list-markets" class="list-markets">
                            
                        </div>
                        <span id="markets-counter">
                            0/4 SELECIONADOS
                        </span>
                    </div>
                </form>
                <div class="new-list-actions">
                    <button id="cancel-list-btn" class="cancel-btn">CANCELAR</button>
                    <button id="save-list-btn" class="save-btn">SALVAR</button>
                </div>
            </div>
        </section>

        <section id="markets" class="markets"> 
            <div class="markets-view">
                <div class="market-action">
                    <button id="new-market-btn" class="call-action-btn">ADICIONAR MERCADO</button>
                </div>

                <div class="markets-container">
                    
                </div>
                
            </div>
        </section>

        <section id="shopping-lists" class="shopping-lists">
            <div class="div-list"></div>   
        </section>

        <section id="shopping-list-active" class="shopping-list-active">
            <div class="shopping-list-header">
                <div class="list-title">
                    <p class="shopping-list-label">COMPRA: <span id="shopping-list-date"></span></p>
                </div>

                <div class="list-item-input">
                    <input type="text" id="item-name" placeholder="NOME DO ITEM">
                    <button id="add-item-btn" class="add-item-btn"><span class="material-symbols-outlined filled">add</span></button>
                </div>
            </div>

            <div id="shopping-list-table" class="shopping-list-table">
                
            </div>
        </section>
        
    </main>

    <footer>
        <p>Comparador de Mercado feito por <a href="https://github.com/Thales-Chaves98" target="_blank">Thales Chaves</a>.</p>
    </footer>

    <dialog id="add-market-modal" class="modal">
        <div class="modal-container">
            <div class="modal-header">
                <h2>ADICIONAR MERCADO</h2>
            </div>
            <div class="modal-content">
                <label for="market-name-input" class="market-label">SUPERMERCADO:</label>
                <input type="text" id="market-name-input" class="market-name-input" placeholder="NOME DO MERCADO">
            </div>
        </div>

        <div class="modal-actions">
            <button id="cancel-market-btn" class="cancel-btn">CANCELAR</button>
            <button id="save-market-btn" class="save-btn">SALVAR</button>
        </div>
        
    </dialog>

    <dialog id="confirm-delete-modal" class="modal">
        <div class="modal-container">
            <div class="modal-header">
                <h2>EXCLUIR ?</h2>
            </div>
            <div class="modal-content">
                <h1>TEM CERTEZA QUE DESEJA EXCLUIR?</h1>
                <p>Essa ação não pode ser desfeita !</p>
            </div>
        </div>

        <div class="modal-actions">
            <button id="cancel-market-btn" class="cancel-btn">CANCELAR</button>
            <button id="delete-market-btn" class="save-btn">SALVAR</button>
        </div>
        
    </dialog>


    <script type="module" src="script/app.js"></script>
</body>
</html>
